name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Verify & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        # Pin to official major release v4 (compatible with GitHub Actions runner Node 20 runtime)
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        # Pin to official major release v4 (compatible with GitHub Actions runner Node 20 runtime)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit commodity taxonomy assignments
        run: npm run check:commodities

      - name: Check Astro types & diagnostics
        run: npx astro check

      - name: Run unit & behavioral tests
        run: npm test

      - name: Check WCAG design token contrast
        run: npm run check:contrast

      - name: Build static output (production)
        run: npm run build

      - name: Audit post-build CSP invariants (0/0/0)
        run: npm run check:csp

      - name: Build draft preview
        env:
          PUBLIC_INCLUDE_DRAFTS: "true"
        run: npm run build
